<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mon Coach"><title>Mon Coach Fitness</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');:root{--green:#22c55e;--green-dark:#16a34a;--green-bg:#dcfce7;--green-text:#15803d;--blue-bg:#dbeafe;--blue-text:#1d4ed8;--amber-bg:#fef3c7;--amber-text:#92400e;--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--light:#f1f5f9;--safe-top:env(safe-area-inset-top,44px);--safe-bottom:env(safe-area-inset-bottom,20px)}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text)}.app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;flex-shrink:0}.topbar-date{font-size:13px;color:var(--muted)}.topbar-title{font-size:17px;font-weight:700}.flame-pill{display:flex;align-items:center;gap:4px;background:#fff7ed;border:1px solid #fed7aa;border-radius:20px;padding:4px 10px;font-size:14px;font-weight:700;color:#c2410c}.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}.bottom-nav{display:flex;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border:none;background:none;cursor:pointer;color:var(--muted);font-size:10px;font-family:inherit;transition:color 0.15s}.nav-btn.active{color:var(--green-dark)}.nav-btn svg{width:22px;height:22px}.tab-content{display:none}.tab-content.active{display:block}.card{background:var(--card);border-radius:16px;border:1px solid var(--border);overflow:hidden;margin-bottom:12px}.card-header{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.card-title{font-size:15px;font-weight:600}.card-body{padding:14px 16px}.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}.badge-run{background:var(--green-bg);color:var(--green-text)}.badge-gym{background:var(--blue-bg);color:var(--blue-text)}.badge-rest{background:var(--light);color:var(--muted)}.goal-card{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);border-radius:20px;padding:20px;margin-bottom:12px;color:white}.goal-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}.goal-big{font-size:36px;font-weight:700;line-height:1}.goal-sub{font-size:12px;opacity:0.7;margin-top:2px}.goal-target{text-align:right}.goal-target-val{font-size:22px;font-weight:700;color:var(--green)}.progress-track{height:6px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden;margin-bottom:10px}.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.6s ease}.eta-row{display:flex;justify-content:space-between;align-items:center}.eta-main{font-size:13px;font-weight:600;color:var(--green)}.eta-sub{font-size:11px;opacity:0.6}.phase-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}.phase-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0}.phase-name{font-size:14px;font-weight:600}.phase-weeks{font-size:12px;color:var(--muted);margin-top:1px}.prog-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}.prog-item:last-child{border-bottom:none;padding-bottom:0}.prog-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}.prog-icon.run{background:var(--green-bg)}.prog-icon.gym{background:var(--blue-bg)}.prog-icon.rest{background:var(--light)}.prog-label{font-size:14px;font-weight:500}.prog-detail{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}.done-btn{display:block;width:100%;padding:14px;font-size:15px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:all 0.15s;border-top:1px solid var(--border)}.done-btn.active{background:var(--green);color:white}.done-btn.done{background:var(--light);color:var(--muted);cursor:default}.meal-row{padding:10px 0;border-bottom:1px solid var(--border)}.meal-row:last-child{border-bottom:none}.meal-time{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}.meal-name{font-size:13px;color:var(--text);margin-top:2px;line-height:1.4}.meal-kcal{font-size:11px;color:var(--muted);margin-top:2px}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}.day-cell{display:flex;flex-direction:column;align-items:center;gap:4px}.day-lbl{font-size:10px;color:var(--muted)}.day-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1.5px solid var(--border);background:var(--light)}.day-dot.done-run{background:var(--green-bg);border-color:var(--green)}.day-dot.done-gym{background:var(--blue-bg);border-color:#93c5fd}.day-dot.done-rest{background:var(--light)}.day-dot.today-ring{border:2.5px solid var(--green)}.day-dot.future{opacity:0.3}.section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px}.weight-input-row{display:flex;gap:8px;margin-bottom:14px}.weight-input-row input{flex:1;padding:12px 14px;font-size:16px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;-webkit-appearance:none}.weight-input-row input:focus{outline:none;border-color:var(--green)}.weight-input-row button{padding:12px 18px;border:none;border-radius:12px;background:var(--green);color:white;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}.w-hist-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}.w-hist-row:last-child{border-bottom:none}.phase-timeline{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.phase-block{border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}.phase-block.active-phase{border-color:var(--green);background:#f0fdf4}.phase-circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}.phase-circle.active{border-color:var(--green);background:var(--green);color:white}.phase-pname{font-size:14px;font-weight:600}.phase-pdesc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}.reminder{background:var(--amber-bg);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--amber-text);font-weight:500}.week-plan-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}.week-plan-row:last-child{border-bottom:none}.week-plan-day{width:30px;color:var(--muted);font-size:12px}</style></head><body><div class="app"><div class="topbar"><div><div class="topbar-date" id="date-str"></div><div class="topbar-title">Mon Coach 💪</div></div><div class="flame-pill" id="flame-pill">🔥 <span id="streak-num">0</span></div></div><div class="scroll-area"><div class="tab-content active" id="tab-today"></div><div class="tab-content" id="tab-week"></div><div class="tab-content" id="tab-prog"></div><div class="tab-content" id="tab-poids"></div></div><div class="bottom-nav"><button class="nav-btn active" onclick="showTab('today',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Aujourd'hui</button><button class="nav-btn" onclick="showTab('week',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Semaine</button><button class="nav-btn" onclick="showTab('prog',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-6"/></svg>Programme</button><button class="nav-btn" onclick="showTab('poids',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4z"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg>Poids</button></div></div><script>const DAYS_S=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];const DAYS_L=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];const SCHED=[{type:'rest',label:'Repos / Motocross'},{type:'run',label:'Course à pied'},{type:'gym',label:'Salle de sport'},{type:'run',label:'Course à pied'},{type:'gym',label:'Salle de sport'},{type:'run',label:'Course à pied'},{type:'rest',label:'Repos actif'}];const PHASES=[{name:'Phase 1 — Réveil',weeks:'Semaines 1–3',desc:'Remise en route. Intensité légère, technique avant tout.'},{name:'Phase 2 — Fondation',weeks:'Semaines 4–6',desc:'Volume qui monte. Le corps s\'adapte progressivement.'},{name:'Phase 3 — Construction',weeks:'Semaines 7–10',desc:'Intensité élevée, prise de muscle, brûlage de graisses.'},{name:'Phase 4 — Définition',weeks:'Semaines 11–16+',desc:'Séchage musculaire, maintien de la force, objectif final.'}];const RUN=[[[[{i:'🏃',t:'Échauffement',d:'5 min marche + 2 min trot léger'},{i:'🔁',t:'Intervalles doux',d:'4 × (2 min course + 2 min marche)'},{i:'📏',t:'Cible',d:'3,5–4 km · ~22 min'}],[{i:'🏃',t:'Course continue',d:'18–20 min allure confortable'},{i:'📏',t:'Cible',d:'4 km, foulée régulière'}],[{i:'🏃',t:'Pyramide',d:'2+3+4+3+2 min avec 1 min marche entre'},{i:'📏',t:'Cible',d:'4,5 km'}]]],[[[{i:'🏃',t:'Tempo run',d:'5 min échauff + 20 min allure soutenue'},{i:'📏',t:'Cible',d:'5 km'}],[{i:'🔁',t:'Fractionné',d:'6 × (3 min rapide + 1 min marche)'},{i:'📏',t:'Cible',d:'5,5 km'}],[{i:'🏃',t:'Long run',d:'30 min sans s\'arrêter, allure modérée'},{i:'📏',t:'Cible',d:'6 km'}]]],[[[{i:'🔁',t:'HIIT course',d:'8 × (1 min sprint + 1 min récup)'},{i:'📏',t:'Cible',d:'5 km intense'}],[{i:'🏃',t:'Tempo soutenu',d:'5 min échauff + 25 min allure race'},{i:'📏',t:'Cible',d:'6,5 km'}],[{i:'🏃',t:'Long run progressif',d:'35 min, les 10 dernières plus rapides'},{i:'📏',t:'Cible',d:'7 km'}]]],[[[{i:'🔁',t:'HIIT intensif',d:'10 × (45 sec sprint + 45 sec marche)'},{i:'📏',t:'Cible',d:'6 km'}],[{i:'🏃',t:'Tempo race',d:'30 min allure compétition'},{i:'📏',t:'Cible',d:'7,5 km'}],[{i:'🏃',t:'Long run endurance',d:'40 min allure facile, récup active'},{i:'📏',t:'Cible',d:'8 km'}]]]];const GYM=[[[[{i:'🦵',t:'Bas du corps',d:'Squat gobelet 3×12 / Fentes 3×10 / Pont fessier 3×15'},{i:'🔥',t:'Cardio',d:'10 min vélo niveau 5'}],[{i:'💪',t:'Haut du corps',d:'Tirage poulie 3×12 / Développé incliné 3×12 / Rowing 3×12'},{i:'🧘',t:'Gainage',d:'3 × 30 sec planche'}],[{i:'⚡',t:'Full body circuit',d:'Burpees 3×10 / Squat sauté 3×12 / Mountain climbers 3×20'},{i:'🔥',t:'Cardio',d:'10 min tapis 8 km/h'}]]],[[[{i:'🦵',t:'Bas hypertrophie',d:'Squat barre 4×12 / Hip thrust 4×15 / Leg curl 3×15'},{i:'🔥',t:'Cardio',d:'12 min vélo niveau 7'}],[{i:'💪',t:'Haut hypertrophie',d:'Tractions assistées 4×10 / Développé couché 4×10 / Face pull 3×15'},{i:'🧘',t:'Gainage',d:'3 × 45 sec planche + 2×20 relevés de jambes'}],[{i:'⚡',t:'Circuit métabolique',d:'4 rounds : Deadlift 10 + Press épaules 10 + Rowing 10'},{i:'🔥',t:'Finisher',d:'10 min elliptique niveau 8'}]]],[[[{i:'🦵',t:'Bas force',d:'Squat barre 5×8 / Fentes lestées 4×10 / Leg press 4×15'},{i:'🔥',t:'HIIT vélo',d:'15 min : 30 sec sprint / 30 sec récup'}],[{i:'💪',t:'Haut force',d:'Tractions lestées 4×8 / Développé couché 5×8 / Rowing barre 4×10'},{i:'🧘',t:'Core intensif',d:'4 × 1 min planche + 3×15 crunchs lestés'}],[{i:'⚡',t:'Full body force',d:'Deadlift 5×5 / Squat 4×8 / Développé militaire 4×10'},{i:'🔥',t:'Finisher',d:'10 min tapis 10 km/h'}]]],[[[{i:'🦵',t:'Bas + cardio',d:'Squat sauté 4×15 / Hip thrust 4×20 / Leg curl 4×15'},{i:'🔥',t:'HIIT finisher',d:'4 × (20 sec burpees / 10 sec repos)'}],[{i:'💪',t:'Haut + cardio',d:'Super-sets : Tirage + Développé 4×12 / Face pull + Curl 3×15'},{i:'🧘',t:'Core sec',d:'4×1 min planche / 3×20 relevés de jambes'}],[{i:'⚡',t:'Circuit brûle-graisses',d:'5 rounds : Deadlift 10 + Burpees 10 + Mountain climbers 20'},{i:'🔥',t:'Finisher',d:'20 min tapis 9 km/h'}]]]];const MEALS={run:[{t:'Matin',n:'Yaourt nature + flocons d\'avoine + melon',k:'~340 kcal'},{t:'Déjeuner',n:'Blanc de poulet + haricots verts vapeur + riz complet',k:'~490 kcal'},{t:'Collation',n:'Bâtonnets de carotte + fromage frais 0%',k:'~110 kcal'},{t:'Dîner',n:'Omelette petits pois + salade de carottes râpées',k:'~370 kcal'}],gym:[{t:'Matin',n:'Œufs brouillés + pain complet + melon',k:'~380 kcal'},{t:'Déjeuner',n:'Thon + haricots blancs + tomates + huile d\'olive',k:'~470 kcal'},{t:'Collation',n:'Blanc de poulet froid + carottes',k:'~140 kcal'},{t:'Dîner',n:'Saumon vapeur + petits pois + salade verte',k:'~410 kcal'}],rest:[{t:'Matin',n:'Yaourt grec + melon frais',k:'~270 kcal'},{t:'Déjeuner',n:'Soupe carottes-lentilles + tranche de pain complet',k:'~370 kcal'},{t:'Collation',n:'Pomme + amandes (15g)',k:'~130 kcal'},{t:'Dîner',n:'Cabillaud vapeur + haricots verts + citron',k:'~350 kcal'}]};function todayKey(){const d=new Date();return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`}function getState(){try{return JSON.parse(localStorage.getItem('coach_v1')||'null')||defaultState()}catch(e){return defaultState()}}function defaultState(){return{streak:0,lastDone:null,weight:93,weights:[],doneDays:{},runIdx:0,gymIdx:0,startDate:new Date().toISOString()}}function saveState(s){try{localStorage.setItem('coach_v1',JSON.stringify(s))}catch(e){}}function getWeekNum(state){const ms=new Date()-new Date(state.startDate);return Math.min(Math.floor(ms/(7*24*3600*1000)),15)}function getPhase(w){return w<3?0:w<6?1:w<10?2:3}function calcETA(state){const cur=state.weights.length>0?state.weights[0].val:state.weight;const tolose=cur-80;if(tolose<=0)return{weeks:0,months:0,dateStr:'Objectif atteint !',rate:'0.40'};let rate=0.4;const wk=getWeekNum(state);if(wk>1&&state.weights.length>=2){const oldest=state.weights[state.weights.length-1].val;const newest=state.weights[0].val;const actual=(oldest-newest)/Math.max(1,wk);if(actual>0.1)rate=Math.min(actual,0.8)}const weeks=Math.ceil(tolose/rate);const months=Math.round(weeks/4.3);const arr=new Date();arr.setDate(arr.getDate()+weeks*7);const dateStr=MONTHS[arr.getMonth()]+' '+arr.getFullYear();return{weeks,months,dateStr,rate:rate.toFixed(2)}}function renderHeader(){const state=getState();const d=new Date();document.getElementById('date-str').textContent=DAYS_L[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];document.getElementById('streak-num').textContent=state.streak;const pill=document.getElementById('flame-pill');pill.style.opacity=state.streak===0?'0.4':'1'}function renderToday(){const state=getState();const dow=new Date().getDay();const s=SCHED[dow];const isDone=!!state.doneDays[todayKey()];const wk=getWeekNum(state);const ph=getPhase(wk);const eta=calcETA(state);const cur=state.weights.length>0?state.weights[0].val:state.weight;const pct=Math.max(0,Math.min(100,Math.round((93-cur)/(93-80)*100)));let progs;if(s.type==='run')progs=RUN[ph][state.runIdx%RUN[ph].length];else if(s.type==='gym')progs=GYM[ph][state.gymIdx%GYM[ph].length];else progs=[{i:'😌',t:'Récupération',d:'Marche légère ou repos complet'},{i:'💧',t:'Hydratation',d:'Boire au moins 2L d\'eau'}];const reminder=(!isDone&&s.type!=='rest')?`<div class="reminder">⏰ <span>${s.type==='run'?"C'est ton jour course — allez, on chausse les baskets !":"Séance salle aujourd'hui — le programme t'attend !"}</span></div>`:'';document.getElementById('tab-today').innerHTML=`<div class="goal-card"><div class="goal-row"><div><div class="goal-big">${cur}<span style="font-size:18px;opacity:0.7"> kg</span></div><div class="goal-sub">poids actuel</div></div><div class="goal-target"><div class="goal-target-val">80 kg</div><div class="goal-sub">objectif musclée</div></div></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="eta-row"><div class="eta-main">~${eta.weeks} semaines · ${eta.dateStr}</div><div class="eta-sub">${pct}% accompli</div></div></div><div class="phase-card"><div class="phase-dot"></div><div><div class="phase-name">${PHASES[ph].name}</div><div class="phase-weeks">${PHASES[ph].weeks} · Semaine ${wk+1}</div></div></div>${reminder}<div class="section-title">Séance du jour</div><div class="card"><div class="card-header"><span class="card-title">${s.label}</span><span class="badge badge-${s.type}">${s.type==='run'?'Course':s.type==='gym'?'Salle':'Repos'}</span></div><div class="card-body">${progs.map(p=>`<div class="prog-item"><div class="prog-icon ${s.type}">${p.i}</div><div><div class="prog-label">${p.t}</div><div class="prog-detail">${p.d}</div></div></div>`).join('')}</div><button class="done-btn ${isDone?'done':'active'}" onclick="markDone()">${isDone?'✅ Séance validée':'Marquer comme fait ✓'}</button></div><div class="section-title">Repas du jour</div><div class="card"><div class="card-body">${MEALS[s.type].map(m=>`<div class="meal-row"><div class="meal-time">${m.t}</div><div class="meal-name">${m.n}</div><div class="meal-kcal">${m.k}</div></div>`).join('')}</div></div>`}function markDone(){const state=getState();const key=todayKey();if(state.doneDays[key])return;state.doneDays[key]=true;const dow=new Date().getDay();if(SCHED[dow].type==='run')state.runIdx++;else if(SCHED[dow].type==='gym')state.gymIdx++;const yest=new Date();yest.setDate(yest.getDate()-1);const yKey=`${yest.getFullYear()}-${yest.getMonth()}-${yest.getDate()}`;if(state.lastDone===yKey||state.lastDone===null)state.streak++;else if(state.lastDone!==key)state.streak=1;state.lastDone=key;saveState(state);renderHeader();renderToday();if(document.getElementById('tab-week').classList.contains('active'))renderWeek()}function renderWeek(){const state=getState();const today=new Date();const mon=new Date(today);mon.setDate(today.getDate()-((today.getDay()+6)%7));let dots='',plan='';for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;const dow=d.getDay();const s=SCHED[dow];const isToday=d.toDateString()===today.toDateString();const isFuture=d>today;const isDone=!!state.doneDays[key];let cls='day-dot';let icon='–';if(!isFuture){if(isDone){cls+=` done-${s.type}`;icon=s.type==='run'?'🏃':s.type==='gym'?'💪':'😌'}else{cls+=' done-rest';icon=isToday?'·':'✗'}}else{cls+=' future';icon=s.type==='run'?'🏃':s.type==='gym'?'💪':'😌'}if(isToday)cls+=' today-ring';dots+=`<div class="day-cell"><div class="day-lbl">${DAYS_S[dow]}</div><div class="${cls}">${icon}</div></div>`}const weekLabels=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];const weekDows=[1,2,3,4,5,6,0];plan=weekLabels.map((lbl,i)=>{const s=SCHED[weekDows[i]];return`<div class="week-plan-row"><span class="week-plan-day">${lbl}</span><span class="badge badge-${s.type}">${s.type==='run'?'Course':s.type==='gym'?'Salle':'Repos'}</span><span style="font-size:13px;margin-left:4px">${s.label}</span></div>`}).join('');document.getElementById('tab-week').innerHTML=`<div class="section-title">Cette semaine</div><div class="card"><div class="card-body"><div class="week-grid">${dots}</div></div></div><div class="section-title">Planning</div><div class="card"><div class="card-body">${plan}</div></div>`}function renderProg(){const state=getState();const wk=getWeekNum(state);const ph=getPhase(wk);const eta=calcETA(state);const timeline=PHASES.map((p,i)=>`<div class="phase-block${i===ph?' active-phase':''}"><div class="phase-circle${i===ph?' active':''}">${i+1}</div><div><div class="phase-pname">${p.name}${i===ph?' ✓':''}</div><div class="phase-pdesc">${p.weeks} · ${p.desc}</div></div></div>`).join('');document.getElementById('tab-prog').innerHTML=`<div class="section-title">Ton objectif</div><div class="card"><div class="card-body" style="text-align:center;padding:20px"><div style="font-size:42px;font-weight:700;color:#22c55e">${eta.weeks}</div><div style="font-size:14px;color:#64748b;margin-top:2px">semaines estimées</div><div style="font-size:16px;font-weight:600;margin-top:8px">${eta.dateStr}</div><div style="font-size:12px;color:#64748b;margin-top:6px">Rythme actuel : ${eta.rate} kg/sem · se recalcule avec tes pesées</div></div></div><div class="section-title">Les 4 phases</div><div class="phase-timeline">${timeline}</div><div style="font-size:12px;color:#64748b;text-align:center;padding:8px 0 4px">Programme adaptatif — les séances évoluent automatiquement chaque semaine selon ta phase</div>`}function renderPoids(){const state=getState();const hist=state.weights.map((w,i)=>{const diff=i<state.weights.length-1?(w.val-state.weights[i+1].val).toFixed(1):null;const arrow=diff?(parseFloat(diff)<0?`<span style="color:#22c55e">${diff} kg</span>`:`<span style="color:#ef4444">+${diff} kg</span>`): '';return`<div class="w-hist-row"><span style="color:#64748b">${w.date}</span><span style="font-weight:600">${w.val} kg ${arrow}</span></div>`}).join('')||'<div style="color:#64748b;font-size:13px;padding:8px 0">Aucune mesure enregistrée</div>';document.getElementById('tab-poids').innerHTML=`<div class="section-title">Enregistrer mon poids</div><div class="weight-input-row"><input type="number" id="w-in" placeholder="ex: 92.5" step="0.1" min="40" max="200" inputmode="decimal"><button onclick="doSaveWeight()">Ajouter</button></div><div class="section-title">Historique</div><div class="card"><div class="card-body">${hist}</div></div>`}function doSaveWeight(){const state=getState();const inp=document.getElementById('w-in');const val=parseFloat(inp.value);if(isNaN(val)||val<40||val>200)return;state.weight=val;state.weights.unshift({val,date:new Date().toLocaleDateString('fr-FR')});if(state.weights.length>30)state.weights=state.weights.slice(0,30);inp.value='';saveState(state);renderPoids();renderHeader()}function showTab(name,btn){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+name).classList.add('active');if(btn)btn.classList.add('active');if(name==='week')renderWeek();else if(name==='prog')renderProg();else if(name==='poids')renderPoids();else renderToday();document.querySelector('.scroll-area').scrollTop=0}renderHeader();renderToday();</script></body></html>
